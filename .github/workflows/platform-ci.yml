name: Platform CI

# Раньше сборка шла только на pull request и push в main, поэтому релизы из
# рабочей ветки уезжали в прод, ни разу не прогнав ни один из 991 теста и ни
# разу — http-smoke, единственную проверку, которая вообще касается настоящей
# базы и межарендной границы. Теперь на каждый push.
on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-backend:
    name: NestJS and Prisma
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: maya_ci
          POSTGRES_PASSWORD: maya_ci
          POSTGRES_USER: maya_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maya_ci -d maya_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: maya-saas-backend
    env:
      AUTH_RATE_LIMIT_SECRET: test-auth-rate-limit-secret-for-ci-only
      AUTH_REFRESH_TOKEN_SECRET: test-refresh-token-secret-for-ci-only
      AUTH_SESSION_METADATA_SECRET: test-session-metadata-secret-for-ci-only
      CRM_ENCRYPTION_KEY: test-crm-encryption-key-for-ci-only
      DATABASE_URL: postgresql://maya_ci:maya_ci@127.0.0.1:5432/maya_ci?schema=public
      JWT_SECRET: test-jwt-signing-secret-for-ci-only
      NODE_ENV: test
      PHONE_AUTH_SECRET: test-phone-auth-secret-for-ci-only
      SEED_DEMO_TENANT_ADMIN_EMAIL: admin@demo-business.local
      SEED_DEMO_TENANT_ADMIN_PASSWORD: test-demo-tenant-password-for-ci
      SEED_PLATFORM_OWNER_EMAIL: owner@maya.local
      SEED_PLATFORM_OWNER_PASSWORD: test-platform-owner-password-for-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: maya-saas-backend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run prisma:generate
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npm run prisma:seed
      - run: npm run typecheck
      - run: npm run typecheck:scripts
      - run: npm run lint
      - run: npm test -- --runInBand
      - run: npm run test:e2e -- --runInBand
      - run: npm run build
      - run: npm run test:http

  legacy-python:
    name: Legacy Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: test-openai-key
      PII_ENCRYPTION_KEY: V6E8Gf1x_oHlgm4mt8d37r4LexILQr1eFN1sq430xV4=
      TELEGRAM_TOKEN: test-telegram-token
      WEBHOOK_SECRET: test-webhook-secret
      YCLIENTS_PARTNER_TOKEN: test-partner-token
      YCLIENTS_USER_TOKEN: test-user-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "ai администратор/requirements.txt"
      - run: python -m pip install --disable-pip-version-check -r "ai администратор/requirements.txt"
      - run: cp "ai администратор/config.example.py" "ai администратор/config.py"
      - run: python -m compileall -q "ai администратор"
      - run: python -m unittest discover -s "ai администратор" -p "test_*.py"

  frontend-bundles:
    name: Frontend bundles
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse inline scripts
        run: >-
          node scripts/verify-frontend-bundles.mjs
          "сайт и приложение/app.html"
          "сайт и приложение/maya-admin.html"
          "сайт и приложение/maya-start.html"
          "сайт и приложение/oauth-callback.html"
      - name: Verify prepublication safety contracts
        run: node scripts/verify-prepublication-contracts.mjs
