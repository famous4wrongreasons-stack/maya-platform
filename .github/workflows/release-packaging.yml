name: Diagnostic compiled phone proof 961fa
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiled-phone-diagnostic:
    name: Diagnostic only - unchanged compiled proof 961fa
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 961fa196c4b02a8badd2ada94f505f5cb838b78f
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: maya-saas-backend
      - run: npx prisma generate
        working-directory: maya-saas-backend
      - name: Install isolated proof database tools
        run: brew list postgresql@16 >/dev/null 2>&1 || brew install postgresql@16
      # Same runner, all lifecycle/lost-response checks, original timeout and original synthetic-only isolation.
      # This partial diagnostic never replaces canonical packaging or authorizes a real booking.
      - name: Ordinary compiled AppModule with signed execution and synthetic HTTP model
        run: node scripts/phone-native-execution-proof-runner.mjs --run --output "$RUNNER_TEMP/native-execution-compiled" --pg-bin "$(brew --prefix postgresql@16)/bin"
        working-directory: maya-saas-backend
      - name: Diagnostic only - retain safe proof status and exact assertion location
        if: always()
        run: |
          node <<'NODE'
          const fs = require('fs'), path = require('path'), crypto = require('crypto'), cp = require('child_process');
          const base = path.join(process.env.RUNNER_TEMP, 'native-execution-compiled');
          const digest = b => crypto.createHash('sha256').update(b).digest('hex');
          const report = { diagnosticOnly: true, admissibleForCertification: false, subjectHead: cp.execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), workflowHead: process.env.GITHUB_SHA, receipts: {} };
          if (report.subjectHead !== '961fa196c4b02a8badd2ada94f505f5cb838b78f') throw Error('wrong diagnostic subject');
          for (const rel of ['manifest.json', 'lifecycle/manifest.json', 'lost-response/manifest.json']) {
            const file = path.join(base, rel);
            if (!fs.existsSync(file)) { report.receipts[rel] = { missing: true }; continue; }
            const bytes = fs.readFileSync(file), value = JSON.parse(bytes);
            const summary = { sha256: digest(bytes) };
            for (const k of ['status', 'clusterStopped', 'applicationStopped', 'syntheticOnly', 'externalEffects', 'realProviderEffects', 'realModelCalls', 'modelCalls', 'chatStatus', 'catalogStatus']) {
              if (typeof value[k] === 'number' || typeof value[k] === 'boolean' || ['running', 'passed', 'failed'].includes(value[k])) summary[k] = value[k];
            }
            for (const k of ['checks', 'completed']) if (Array.isArray(value[k])) summary[k] = value[k].filter(x => typeof x === 'string' && /^[a-zA-Z0-9_-]+$/.test(x));
            if (value.failure) {
              const f = value.failure;
              summary.failureDigest = digest(JSON.stringify(f));
              if (typeof f === 'string' && /^[a-z-]+: (null|[0-9]+)\/(null|SIG[A-Z]+)$/.test(f)) summary.failedStep = f;
              if (typeof f === 'object') {
                summary.errorName = /^[a-zA-Z0-9_]+$/.test(f.name ?? '') ? f.name : 'unclassified';
                summary.frames = String(f.stack ?? '').split('\n').filter(line => /^\s+at /.test(line) && /:[0-9]+:[0-9]+\)?$/.test(line));
              }
            }
            report.receipts[rel] = summary;
          }
          const out = path.join(process.env.RUNNER_TEMP, 'native-execution-diagnostic-safe.json');
          fs.writeFileSync(out, JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(report, null, 2));
          NODE
      - name: Diagnostic only - project exact availability status without private payloads
        if: always()
        run: |
          node --input-type=module <<'NODE'
          // Read-only, post-run projection. No response values, fixtures or assertions change.
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { pathToFileURL } from 'node:url';
          export const SUBJECT = '961fa196c4b02a8badd2ada94f505f5cb838b78f';
          export const PROOF_HASH = 'd9b7363339e0bb62afaa3fd025c305a917cba4c6d7f11658f0681952738e6c27';
          const digest = bytes => createHash('sha256').update(bytes).digest('hex');
          const record = value => value !== null && typeof value === 'object' && !Array.isArray(value);
          const codes = new Set([
            'validation', 'ai_tool_arguments_invalid', 'ai_tool_forbidden',
            'ai_tool_not_found', 'subscription_required', 'ai_tool_idempotency_conflict',
            'ai_tool_availability_source_changed', 'booking_preview_stale',
            'booking_branch_source_unavailable', 'crm_integration_not_active',
            'service_catalog_source_unavailable', 'phone_native_create_egress_refused',
            'phone_native_channel_refused', 'ai_tool_execution_failed',
          ]);
          const classes = new Set([
            'Bad Request', 'Unauthorized', 'Forbidden', 'Not Found', 'Conflict',
            'Too Many Requests', 'Internal Server Error', 'Service Unavailable',
          ]);
          const fields = new Set(['date', 'arguments', 'branch_id', 'staff_id', 'service_ids', 'surface']);
          const status = n => Number.isInteger(n) && n >= 100 && n <= 599;
          const frame = /^\s+at file:\/\/[^\r\n]*\/test\/widgets-live\/support\/native-execution-compiled-proof\.mjs:1072:10$/m;

          export function projectAvailability(manifest, source) {
            const out = {
              contract: 'maya.native-availability-diagnostic-safe/1',
              diagnosticOnly: true,
              admissibleForCertification: false,
              subjectHead: source.subjectHead === SUBJECT ? SUBJECT : null,
              proofSha256: source.proofSha256 === PROOF_HASH ? PROOF_HASH : null,
              classification: 'UNCLASSIFIED',
              httpStatus: null,
              machineCode: null,
            };
            if (source.subjectHead !== SUBJECT || source.proofSha256 !== PROOF_HASH) {
              out.reason = 'unpinned_subject_or_proof';
              return out;
            }
            const failure = record(manifest) && record(manifest.failure) ? manifest.failure : null;
            if (!failure || failure.name !== 'AssertionError' || typeof failure.stack !== 'string' || !frame.test(failure.stack)) {
              out.reason = 'not_exact_availability_status_assertion';
              return out;
            }
            if (typeof failure.message !== 'string' || Buffer.byteLength(failure.message) > 131072) {
              out.reason = 'missing_or_oversized_assertion_message';
              return out;
            }
            // Node22.23.3 custom assert.equal message is JSON.stringify(response.body)
            // plus the actual/expected numeric comparison. Never infer status from stack alone.
            const match = /^(\{[^\r\n]*\})\n\n([1-5][0-9]{2}) !== 201\n$/.exec(failure.message);
            if (!match || Number(match[2]) === 201) {
              out.reason = 'unknown_assertion_message_format';
              return out;
            }
            let body;
            try { body = JSON.parse(match[1]); } catch {
              out.reason = 'invalid_response_body_json';
              return out;
            }
            if (!record(body)) {
              out.reason = 'response_body_not_object';
              return out;
            }
            out.classification = 'EXACT_ASSERTION_RESPONSE_STATUS_RECOVERED';
            out.httpStatus = Number(match[2]);
            out.statusEvidence = 'actual availability.status encoded by pinned Node assert.equal; not inferred from frame or body.statusCode';
            const code = record(body.error) ? body.error.code : body.error;
            const candidate = typeof code === 'string' ? code : body.code;
            out.machineCode = codes.has(candidate) ? candidate : null;
            out.machineCodeDisposition = candidate == null ? 'absent' : out.machineCode === null ? 'not_allowlisted_redacted' : 'allowlisted';
            out.frameworkError = classes.has(body.error) ? body.error : null;
            out.bodyStatusCode = status(body.statusCode) ? body.statusCode : null;
            out.bodyStatusAgrees = out.bodyStatusCode === null ? null : out.bodyStatusCode === out.httpStatus;
            out.validationField = record(body.error) && fields.has(body.error.field) ? body.error.field : null;
            out.serverErrorSignals = [];
            // A generic500 may hide the class upstream. Only fixed tags/numeric status
            // survive; no raw server message, stack, route, ID or model/provider payload.
            for (const item of Array.isArray(manifest.syntheticServerErrors) ? manifest.syntheticServerErrors.slice(0, 32) : []) {
              if (!record(item) || typeof item.message !== 'string') continue;
              const message = item.message;
              let signal;
              const provider = /^(?:CrmProviderResponseError|Error): YClients request failed with status ([1-5][0-9]{2})(?::[^\r\n]*)?$/.exec(message);
              if (provider) signal = { tag: 'provider_response_error', providerHttpStatus: Number(provider[1]) };
              else if (/^(?:(?:CrmOutcomeUnknownError|Error): )?YClients (?:did not answer in time|response body was interrupted) \((?:GET|POST|PUT|DELETE) [^\r\n]*\)$/.test(message)) signal = { tag: 'provider_transport_incomplete' };
              else if (/^(?:Error: )?phone_native_channel_refused$/.test(message)) signal = { tag: 'native_channel_refused' };
              else if (/^(?:Error: )?booking_slot_facts_unavailable$/.test(message)) signal = { tag: 'slot_facts_unavailable' };
              else if (/^(?:AssertionError[^:]*: )?unexpected synthetic catalogue route$/.test(message)) signal = { tag: 'unexpected_synthetic_catalogue_route' };
              if (signal && !out.serverErrorSignals.some(x => JSON.stringify(x) === JSON.stringify(signal))) out.serverErrorSignals.push(signal);
            }
            return out;
          }

          if (process.argv[1] && import.meta.url === pathToFileURL(path.resolve(process.argv[1])).href) {
            const [manifestFile, proofFile, outputFile] = process.argv.slice(2);
            if (![manifestFile, proofFile, outputFile].every(p => typeof p === 'string' && path.isAbsolute(p)) || fs.existsSync(outputFile)) throw Error('three absolute paths and a fresh output are required');
            const subjectHead = execFileSync('git', ['-C', path.dirname(proofFile), 'rev-parse', 'HEAD'], {encoding:'utf8'}).trim();
            const proofSha256 = digest(fs.readFileSync(proofFile));
            const bytes = fs.readFileSync(manifestFile);
            const report = projectAvailability(JSON.parse(bytes), { subjectHead, proofSha256 });
            report.inputManifestSha256 = digest(bytes);
            report.projectionEnvironment = { node: process.version, icu: process.versions.icu, platform: process.platform, arch: process.arch, dateIsIso: /^\d{4}-\d{2}-\d{2}$/.test(new Intl.DateTimeFormat('en-CA', {timeZone:'Europe/Moscow',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(Date.now()+86400000))) };
            fs.writeFileSync(outputFile, JSON.stringify(report, null, 2)+'\n', {flag:'wx',mode:0o600});
            console.log(JSON.stringify(report));
          }

          const proofFile = path.join(process.env.GITHUB_WORKSPACE, 'maya-saas-backend/test/widgets-live/support/native-execution-compiled-proof.mjs');
          const manifestFile = path.join(process.env.RUNNER_TEMP, 'native-execution-compiled/lifecycle/manifest.json');
          const subjectHead = execFileSync('git', ['-C', process.env.GITHUB_WORKSPACE, 'rev-parse', 'HEAD'], {encoding:'utf8'}).trim();
          const projected = fs.existsSync(manifestFile)
            ? projectAvailability(JSON.parse(fs.readFileSync(manifestFile, 'utf8')), {subjectHead, proofSha256:digest(fs.readFileSync(proofFile))})
            : {diagnosticOnly:true,admissibleForCertification:false,classification:'UNCLASSIFIED',reason:'missing_raw_lifecycle_manifest',httpStatus:null,machineCode:null};
          if (fs.existsSync(manifestFile)) projected.inputManifestSha256 = digest(fs.readFileSync(manifestFile));
          projected.projectionEnvironment = {node:process.version,icu:process.versions.icu,platform:process.platform,arch:process.arch,dateIsIso: /^\d{4}-\d{2}-\d{2}$/.test(new Intl.DateTimeFormat('en-CA', {timeZone:'Europe/Moscow',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(Date.now()+86400000)))};
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'native-availability-diagnostic-safe.json'), JSON.stringify(projected,null,2)+'\n', {flag:'wx',mode:0o600});
          console.log(JSON.stringify(projected,null,2));
          NODE
      - name: Diagnostic only - upload safe summary, never private fixture material
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-only-compiled-961fa-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-execution-diagnostic-safe.json
            ${{ runner.temp }}/native-availability-diagnostic-safe.json
          if-no-files-found: error
          retention-days: 14
