name: Diagnostic compiled availability 03aef
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiled-availability-diagnostic:
    name: Diagnostic only - canonical packaging prefix and unchanged 03aef proof
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Diagnostic tools from the manually selected workflow commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: diagnostic-tools
      - name: Immutable product subject - no diagnostic files copied into this checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 03aefcb1060c9263644a0033a2b55bc97a326337
          path: subject
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Expanded finite-code projector preserves original source and redaction controls
        run: node --test diagnostic-tools/maya-saas-backend/scripts/phone-native-proof-diagnostic.test.mjs
      - name: Verify subject, proof, runner and separate workflow identity before any proof
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const subject = path.join(process.env.GITHUB_WORKSPACE, 'subject');
          const tools = path.join(process.env.GITHUB_WORKSPACE, 'diagnostic-tools');
          const git = (root, ...args) => execFileSync('git', ['-C', root, ...args], {encoding:'utf8'}).trim();
          const hash = file => createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          assert.equal(git(subject, 'rev-parse', 'HEAD'), '03aefcb1060c9263644a0033a2b55bc97a326337');
          assert.match(process.env.GITHUB_SHA, /^[a-f0-9]{40}$/);
          assert.equal(git(tools, 'rev-parse', 'HEAD'), process.env.GITHUB_SHA);
          assert.equal(git(subject, 'diff', 'HEAD', '--'), '');
          assert.equal(git(tools, 'diff', 'HEAD', '--'), '');
          assert.equal(hash(path.join(subject, 'maya-saas-backend/test/widgets-live/support/native-execution-compiled-proof.mjs')), 'd9b7363339e0bb62afaa3fd025c305a917cba4c6d7f11658f0681952738e6c27');
          assert.equal(hash(path.join(subject, 'maya-saas-backend/scripts/phone-native-execution-proof-runner.mjs')), 'b5b505937c4c9b73e9eef993301ec063037b45b7d4453f840b58791f1a2f2004');
          NODE
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: subject/maya-saas-backend
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: subject/maya-carrier-react
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: subject/maya-ios-carrier
      - run: npm run sync
        working-directory: subject/maya-ios-carrier
      - run: npm test && npm run test:release
        working-directory: subject/maya-carrier-react
      - name: Refuse retired staging carrier before deployment
        run: node --test scripts/staging-carrier-preflight.test.mjs
        working-directory: subject/maya-saas-backend
      - run: node --test scripts/widget-release-operator.test.cjs scripts/widgets-mutation-report.test.mjs
        working-directory: subject/maya-saas-backend
      - name: Safe compiled failure projection redaction and source bindings
        run: node --test scripts/phone-native-proof-diagnostic.test.mjs
        working-directory: subject/maya-saas-backend
      - run: npx prisma generate && npm run build
        working-directory: subject/maya-saas-backend
      - name: Private phone staging boundaries and Prisma image configuration
        run: node --test scripts/phone-staging-plan.test.mjs scripts/phone-catalog-egress.test.mjs scripts/phone-owner-bootstrap-plan.test.mjs scripts/phone-catalog-plan.test.mjs
        working-directory: subject/maya-saas-backend
      - name: Phone catalogue restriction mutations with green baseline and restored source
        run: node scripts/phone-catalog-mutations.mjs
        working-directory: subject/maya-saas-backend
      - run: node --test scripts/widget-release-operator.compiled-test.cjs
        working-directory: subject/maya-saas-backend
      - name: Native execution signature, replay and legacy transport controls
        run: node --test scripts/phone-native-execution.test.mjs scripts/phone-native-create-egress.test.mjs scripts/phone-native-run-guard.test.mjs scripts/phone-native-channel.test.mjs scripts/phone-native-packaging.test.mjs
        working-directory: subject/maya-saas-backend
      - name: Awaited signed execution uses the complete lifecycle transport corpus
        run: MAYA_TEST_NATIVE_EXECUTION=1 node --test scripts/phone-native-create-egress.test.mjs
        working-directory: subject/maya-saas-backend
      - name: Native execution adversarial mutations with green control
        run: node scripts/phone-native-execution-mutation.mjs --run "$RUNNER_TEMP/native-execution-mutations"
        working-directory: subject/maya-saas-backend
      - name: Install isolated proof database tools
        run: brew list postgresql@16 >/dev/null 2>&1 || brew install postgresql@16
      - name: Ordinary compiled AppModule with signed execution and synthetic HTTP model
        run: node scripts/phone-native-execution-proof-runner.mjs --run --output "$RUNNER_TEMP/native-execution-compiled" --pg-bin "$(brew --prefix postgresql@16)/bin"
        working-directory: subject/maya-saas-backend
      # Only this observer comes from diagnostic-tools. Subject runtime, proof,
      # fixtures, 8 s tool timeout, synthetic isolation and all assertions are unchanged.
      # The canonical packaging prefix above is retained for comparable preparation.
      # This manual diagnostic omits the independent Linux job and post-proof Xcode tail.
      - name: Diagnostic only - safe post-run status and exact finite refusal code
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { projectAvailability, PROOF_HASH } from './diagnostic-tools/maya-saas-backend/scripts/phone-native-proof-diagnostic.mjs';
          const subject = path.join(process.env.GITHUB_WORKSPACE, 'subject');
          const tools = path.join(process.env.GITHUB_WORKSPACE, 'diagnostic-tools');
          const git = (root, ...args) => execFileSync('git', ['-C', root, ...args], {encoding:'utf8'}).trim();
          const digest = bytes => createHash('sha256').update(bytes).digest('hex');
          const hash = file => digest(fs.readFileSync(file));
          const expectedHead = '03aefcb1060c9263644a0033a2b55bc97a326337';
          const subjectHead = git(subject, 'rev-parse', 'HEAD');
          const workflowHead = git(tools, 'rev-parse', 'HEAD');
          const proofSha256 = hash(path.join(subject, 'maya-saas-backend/test/widgets-live/support/native-execution-compiled-proof.mjs'));
          const runnerSha256 = hash(path.join(subject, 'maya-saas-backend/scripts/phone-native-execution-proof-runner.mjs'));
          assert.equal(subjectHead, expectedHead);
          assert.match(process.env.GITHUB_SHA, /^[a-f0-9]{40}$/);
          assert.equal(workflowHead, process.env.GITHUB_SHA);
          assert.equal(git(subject, 'diff', 'HEAD', '--'), '');
          assert.equal(git(tools, 'diff', 'HEAD', '--'), '');
          assert.equal(PROOF_HASH, 'd9b7363339e0bb62afaa3fd025c305a917cba4c6d7f11658f0681952738e6c27');
          assert.equal(proofSha256, PROOF_HASH);
          assert.equal(runnerSha256, 'b5b505937c4c9b73e9eef993301ec063037b45b7d4453f840b58791f1a2f2004');
          const report = {contract:'maya.native-compiled-diagnostic-safe/1', diagnosticOnly:true, admissibleForCertification:false, scope:'canonical_packaging_prefix_through_compiled_proof_only', expectedHead, subjectHead, workflowHead, proofSha256, runnerSha256, projectorSha256:hash(path.join(tools,'maya-saas-backend/scripts/phone-native-proof-diagnostic.mjs')), workflowSha256:hash(path.join(tools,'.github/workflows/release-packaging.yml')), receipts:{}};
          const proofRoot = path.join(process.env.RUNNER_TEMP, 'native-execution-compiled');
          for (const relative of ['manifest.json', 'lifecycle/manifest.json', 'lost-response/manifest.json']) {
            const file = path.join(proofRoot, relative);
            if (!fs.existsSync(file)) { report.receipts[relative] = {present:false}; continue; }
            const bytes = fs.readFileSync(file), manifest = JSON.parse(bytes);
            const row = {present:true,sha256:digest(bytes),status:['running','passed','failed'].includes(manifest.status) ? manifest.status : null};
            for (const key of ['clusterStopped','applicationStopped','syntheticOnly'])
              if (typeof manifest[key] === 'boolean') row[key] = manifest[key];
            for (const key of ['realProviderEffects','realModelCalls','externalEffects'])
              if (Number.isSafeInteger(manifest[key]) && manifest[key] >= 0) row[key] = manifest[key];
            if (relative !== 'manifest.json') row.availabilityFailure = projectAvailability(manifest, {subjectHead,expectedHead,proofSha256});
            report.receipts[relative] = row;
          }
          report.projectionEnvironment = {node:process.version,icu:process.versions.icu,platform:process.platform,arch:process.arch,dateIsIso:/^\d{4}-\d{2}-\d{2}$/.test(new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Moscow',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(Date.now()+86400000)))};
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'native-compiled-diagnostic-safe.json'), JSON.stringify(report,null,2)+'\n', {flag:'wx',mode:0o600});
          console.log(JSON.stringify(report));
          NODE
      - name: Diagnostic only - upload finite safe receipt, never raw failure or private material
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-only-compiled-availability-03aef-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-compiled-diagnostic-safe.json
          if-no-files-found: error
          retention-days: 14
