name: Diagnostic compiled phone proof 961fa
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiled-phone-diagnostic:
    name: Diagnostic only - unchanged compiled proof 961fa
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 961fa196c4b02a8badd2ada94f505f5cb838b78f
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: maya-saas-backend
      - run: npx prisma generate
        working-directory: maya-saas-backend
      - name: Install isolated proof database tools
        run: brew list postgresql@16 >/dev/null 2>&1 || brew install postgresql@16
      # Same runner, all lifecycle/lost-response checks, original timeout and original synthetic-only isolation.
      # This partial diagnostic never replaces canonical packaging or authorizes a real booking.
      - name: Ordinary compiled AppModule with signed execution and synthetic HTTP model
        run: node scripts/phone-native-execution-proof-runner.mjs --run --output "$RUNNER_TEMP/native-execution-compiled" --pg-bin "$(brew --prefix postgresql@16)/bin"
        working-directory: maya-saas-backend
      - name: Diagnostic only - retain safe proof status and exact assertion location
        if: always()
        run: |
          node <<'NODE'
          const fs = require('fs'), path = require('path'), crypto = require('crypto'), cp = require('child_process');
          const base = path.join(process.env.RUNNER_TEMP, 'native-execution-compiled');
          const digest = b => crypto.createHash('sha256').update(b).digest('hex');
          const report = { diagnosticOnly: true, admissibleForCertification: false, subjectHead: cp.execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), workflowHead: process.env.GITHUB_SHA, receipts: {} };
          if (report.subjectHead !== '961fa196c4b02a8badd2ada94f505f5cb838b78f') throw Error('wrong diagnostic subject');
          for (const rel of ['manifest.json', 'lifecycle/manifest.json', 'lost-response/manifest.json']) {
            const file = path.join(base, rel);
            if (!fs.existsSync(file)) { report.receipts[rel] = { missing: true }; continue; }
            const bytes = fs.readFileSync(file), value = JSON.parse(bytes);
            const summary = { sha256: digest(bytes) };
            for (const k of ['status', 'clusterStopped', 'applicationStopped', 'syntheticOnly', 'externalEffects', 'realProviderEffects', 'realModelCalls', 'modelCalls', 'chatStatus', 'catalogStatus']) {
              if (typeof value[k] === 'number' || typeof value[k] === 'boolean' || ['running', 'passed', 'failed'].includes(value[k])) summary[k] = value[k];
            }
            for (const k of ['checks', 'completed']) if (Array.isArray(value[k])) summary[k] = value[k].filter(x => typeof x === 'string' && /^[a-zA-Z0-9_-]+$/.test(x));
            if (value.failure) {
              const f = value.failure;
              summary.failureDigest = digest(JSON.stringify(f));
              if (typeof f === 'string' && /^[a-z-]+: (null|[0-9]+)\/(null|SIG[A-Z]+)$/.test(f)) summary.failedStep = f;
              if (typeof f === 'object') {
                summary.errorName = /^[a-zA-Z0-9_]+$/.test(f.name ?? '') ? f.name : 'unclassified';
                summary.frames = String(f.stack ?? '').split('\n').filter(line => /^\s+at /.test(line) && /:[0-9]+:[0-9]+\)?$/.test(line));
              }
            }
            report.receipts[rel] = summary;
          }
          const out = path.join(process.env.RUNNER_TEMP, 'native-execution-diagnostic-safe.json');
          fs.writeFileSync(out, JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(report, null, 2));
          NODE
      - name: Diagnostic only - upload safe summary, never private fixture material
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-only-compiled-961fa-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-execution-diagnostic-safe.json
          if-no-files-found: error
          retention-days: 14
