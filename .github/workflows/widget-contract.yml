name: Widget Contract

# L2 owner decision: every applicable contract check is blocking. The release
# collector repeats these checks before admitting the full fresh mutation corpus.
on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: widget-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  widget-contract:
    name: Widget Contract (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: maya-saas-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: maya-saas-backend/package-lock.json
      - run: npm ci
      - name: Generate the canonical Prisma client before contract compilation
        run: npm run prisma:generate
      - name: The certified contract compiles
        run: npx tsc --noEmit --project tsconfig.widget-contract.json
      - name: Widget Contract checkers
        run: node scripts/widget-contract-check.mjs
      - name: Wave 1 fence - the contract module is excluded from the build
        run: |
          grep -q '"src/widget-contract"' tsconfig.build.json
          echo "src/widget-contract is excluded from tsconfig.build.json: deployed bytes unchanged"

  k1-dossier:
    name: K1 surface dossier (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: The dossier covers every surface, and the ledgers are complete
        run: node docs/rebuild/evidence/maya-chat-first-ux/k1/k1-dossier-check.mjs
