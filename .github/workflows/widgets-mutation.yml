name: Widgets Mutation

# The widget gates' mutation battery (integration plan §4.5; GATES-PLAN-V11 I-HAR): every mutant a gate unit
# declares in `maya-saas-backend/test/widgets-live/mutations/gate<id>.json` is applied to a temporary copy of the
# backend, never to the checkout, and must turn its declared killer red. Measured full runs of Gates 6, 7,
# 9, 10 and 13 exceed the unchanged 180-minute job budget, while P-mint completed with only two minutes of margin.
# Those batteries partition mutants while retaining UNFILTERED tests and independent controls in every job.
# Other batteries run whole. A shard whose UNMUTATED baseline control was not green reports BASELINE-RED and exits
# non-zero — it measured nothing its mutants can be judged by, whether or not a declared killer was among the
# failures. Mandatory aggregation refuses missing/duplicate/stale
# parts, restricted tests, crashes, red baseline controls and vacuous kills before publishing 30 complete battery receipts.
# CKPT-W step 7 dispatches this workflow for the flipping commit with
# `gates=<every battery touched in the wave>` (pushes to the canonical closure branch also run every battery) and records every shard's run and artifact
# id. Only `[HTTP]` kills in a shard report count toward L/L-T (§3.2). While no battery is declared the one shard
# reports EMPTY, which is not evidence.
#
# The env block is platform-ci.yml's literals plus the declared widgets-live extras
# (`test/widgets-live/support/environment.ts`, IR-H1); `harness.live-spec.ts` (HAR-4) asserts it.
#
# L2: complete fresh release admission is mandatory; partial diagnostic batteries cannot admit a release.
on:
  # workflow_dispatch cannot discover a workflow absent from the default branch.
  # A real canonical-branch push receipt is mandatory for Wave 1 closure.
  push:
    branches:
      - codex/maya-identity-consent-20260913
  workflow_dispatch:
    inputs:
      gates:
        description: 'Battery ids to run, comma separated (gate<id>.json, e.g. H-harness,T-tables). Empty: every declared battery.'
        required: false
        default: ''
        type: string
  pull_request:
    paths:
      - maya-saas-backend/src/widgets/**
      - maya-saas-backend/src/widget-contract/**
      - maya-saas-backend/prisma/**
      - maya-saas-backend/test/widgets-live/**
      - maya-saas-backend/scripts/widgets-mutation*
      - .github/workflows/widgets-mutation.yml

permissions:
  contents: read

concurrency:
  group: widgets-mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shards:
    name: Battery shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      gates: ${{ steps.plan.outputs.gates }}
      matrix: ${{ steps.plan.outputs.matrix }}
    defaults:
      run:
        working-directory: maya-saas-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run prisma:generate
      - name: Verify scheduling and fail-closed receipt assembly
        run: node --test scripts/widgets-mutation-ci.test.mjs
      - id: plan
        # The input reaches the runner as an environment value, never interpolated into the script; the runner
        # admits only declared battery ids.
        env:
          REQUESTED_GATES: ${{ inputs.gates }}
        run: node scripts/widgets-mutation-ci.mjs plan "${REQUESTED_GATES:-}" >> "$GITHUB_OUTPUT"

  widgets-mutation:
    name: Widgets mutation battery (${{ matrix.slot }})
    needs: shards
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.shards.outputs.matrix) }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: maya_ci
          POSTGRES_PASSWORD: maya_ci
          POSTGRES_USER: maya_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maya_ci -d maya_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: maya-saas-backend
    env:
      ACTION_ENGINE_IDENTITY_SECRET: test-action-engine-identity-secret-for-widgets-live-only
      ACTION_ENGINE_PAYLOAD_ENCRYPTION_SECRET: test-action-engine-payload-secret-for-widgets-live-only
      AUTH_RATE_LIMIT_SECRET: test-auth-rate-limit-secret-for-ci-only
      AUTH_REFRESH_TOKEN_SECRET: test-refresh-token-secret-for-ci-only
      AUTH_SESSION_METADATA_SECRET: test-session-metadata-secret-for-ci-only
      CRM_ENCRYPTION_KEY: test-crm-encryption-key-for-ci-only
      DATABASE_URL: postgresql://maya_ci:maya_ci@127.0.0.1:5432/maya_ci?schema=public
      JWT_SECRET: test-jwt-signing-secret-for-ci-only
      MAYA_GIFT_CERTIFICATE_CLAIM_SECRET: test-gift-certificate-claim-secret-for-widgets-live-only
      MAYA_GIFT_CERTIFICATE_PRESENTATION_KEY: test-gift-certificate-presentation-key-for-widgets-live-only
      MAYA_GIFT_CERTIFICATE_PRESENTATION_KEY_VERSION: widgets-live-test-1
      MAYA_LOYALTY_REDEMPTION_CODE_PEPPER: test-loyalty-redemption-code-pepper-for-widgets-live-only
      MAYA_REFERRAL_REWARD_CLAIM_SECRET: test-referral-reward-claim-secret-for-widgets-live-only
      MAYA_REFERRAL_REWARD_PRESENTATION_KEY: test-referral-reward-presentation-key-for-widgets-live-only
      MAYA_REFERRAL_REWARD_PRESENTATION_KEY_VERSION: widgets-live-test-1
      NODE_ENV: test
      PHONE_AUTH_SECRET: test-phone-auth-secret-for-ci-only
      SEED_DEMO_TENANT_ADMIN_EMAIL: admin@demo-business.local
      SEED_DEMO_TENANT_ADMIN_PASSWORD: test-demo-tenant-password-for-ci
      SEED_PLATFORM_OWNER_EMAIL: owner@maya.local
      SEED_PLATFORM_OWNER_PASSWORD: test-platform-owner-password-for-ci
      WIDGET_GATEWAY_PG: required
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: maya-saas-backend/package-lock.json
      - name: Install architectural scanner prerequisite
        run: |
          if ! command -v rg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma migrate deploy
      - name: Build the canonical React pipeline used by L5/L24 live proofs
        run: |
          npm ci --prefix ../maya-carrier-react
          node ../maya-carrier-react/test/build-harness.mjs
      # Full unmutated unit controls include R01's integration-only artifact proof.
      # Build its fixture from this SHA; do not copy a historical carrier artifact.
      - name: Build the runtime artifact required by the R01 integration proof
        run: node ../maya-chat-shell/build.mjs
      - name: Run the battery shard
        env:
          SHARD: ${{ matrix.gate }}
          PARTITION: ${{ matrix.partition }}
          SLOT: ${{ matrix.slot }}
        run: |
          if [ -n "$PARTITION" ]; then
            node scripts/widgets-mutation-battery.mjs --gate "$SHARD" --partition "$PARTITION" --out "widgets-mutation-part-$SLOT.json"
          else
            node scripts/widgets-mutation-battery.mjs --gate "$SHARD" --out "widgets-mutation-part-$SLOT.json"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: widgets-mutation-part-${{ github.sha }}-${{ matrix.slot }}
          path: maya-saas-backend/widgets-mutation-part-*.json
          if-no-files-found: error

  receipt:
    name: Complete mutation receipt (all requested batteries)
    needs: [shards, widgets-mutation]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require every partition job to succeed
        env:
          RESULT: ${{ needs.widgets-mutation.result }}
        run: test "$RESULT" = success
      - uses: actions/download-artifact@v4
        with:
          pattern: widgets-mutation-part-${{ github.sha }}-*
          path: mutation-parts
          merge-multiple: true
      - name: Install release-contract checkers
        run: npm ci --prefix maya-saas-backend
      - name: Generate the canonical client for release-contract checks
        run: npm run prisma:generate --prefix maya-saas-backend
      - name: Verify blocking contract and complete fresh declaration coverage
        env:
          REQUESTED_GATES: ${{ inputs.gates }}
        run: node maya-saas-backend/scripts/widgets-mutation-ci.mjs release mutation-parts mutation-receipt "$GITHUB_SHA" "${REQUESTED_GATES:-}"
      - uses: actions/upload-artifact@v4
        with:
          name: widgets-mutation-complete-${{ github.sha }}
          path: mutation-receipt/widgets-mutation-report-*.json
          if-no-files-found: error
