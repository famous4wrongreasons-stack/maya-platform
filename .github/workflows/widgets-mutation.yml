# DIAGNOSTIC ONLY: exact product checkout; no canonical release admission.
name: Widgets Mutation diagnosis only
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  widgets-mutation:
    name: 'Diagnostic only: unchanged full FP; diagnostic only'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: maya_ci
          POSTGRES_PASSWORD: maya_ci
          POSTGRES_USER: maya_ci
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U maya_ci -d maya_ci" --health-interval 5s --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: maya-saas-backend
    env:
      ACTION_ENGINE_IDENTITY_SECRET: test-action-engine-identity-secret-for-widgets-live-only
      ACTION_ENGINE_PAYLOAD_ENCRYPTION_SECRET: test-action-engine-payload-secret-for-widgets-live-only
      AUTH_RATE_LIMIT_SECRET: test-auth-rate-limit-secret-for-ci-only
      AUTH_REFRESH_TOKEN_SECRET: test-refresh-token-secret-for-ci-only
      AUTH_SESSION_METADATA_SECRET: test-session-metadata-secret-for-ci-only
      CRM_ENCRYPTION_KEY: test-crm-encryption-key-for-ci-only
      DATABASE_URL: postgresql://maya_ci:maya_ci@127.0.0.1:5432/maya_ci?schema=public
      JWT_SECRET: test-jwt-signing-secret-for-ci-only
      MAYA_GIFT_CERTIFICATE_CLAIM_SECRET: test-gift-certificate-claim-secret-for-widgets-live-only
      MAYA_GIFT_CERTIFICATE_PRESENTATION_KEY: test-gift-certificate-presentation-key-for-widgets-live-only
      MAYA_GIFT_CERTIFICATE_PRESENTATION_KEY_VERSION: widgets-live-test-1
      MAYA_LOYALTY_REDEMPTION_CODE_PEPPER: test-loyalty-redemption-code-pepper-for-widgets-live-only
      MAYA_REFERRAL_REWARD_CLAIM_SECRET: test-referral-reward-claim-secret-for-widgets-live-only
      MAYA_REFERRAL_REWARD_PRESENTATION_KEY: test-referral-reward-presentation-key-for-widgets-live-only
      MAYA_REFERRAL_REWARD_PRESENTATION_KEY_VERSION: widgets-live-test-1
      NODE_ENV: test
      PHONE_AUTH_SECRET: test-phone-auth-secret-for-ci-only
      SEED_DEMO_TENANT_ADMIN_EMAIL: admin@demo-business.local
      SEED_DEMO_TENANT_ADMIN_PASSWORD: test-demo-tenant-password-for-ci
      SEED_PLATFORM_OWNER_EMAIL: owner@maya.local
      SEED_PLATFORM_OWNER_PASSWORD: test-platform-owner-password-for-ci
      WIDGET_GATEWAY_PG: required
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 18fc4314d5b1a24370d426520315bdf63735bbec
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: maya-saas-backend/package-lock.json
      - name: Install architectural scanner prerequisite
        run: |
          if ! command -v rg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma migrate deploy
      - name: Build the canonical React pipeline used by L5/L24 live proofs
        run: |
          npm ci --prefix ../maya-carrier-react
          node ../maya-carrier-react/test/build-harness.mjs
      - name: Build the runtime artifact required by the R01 integration proof
        run: node ../maya-chat-shell/build.mjs
      - name: Install read-only process observer outside checkout
        run: |
          cat > "$RUNNER_TEMP/maya-observe-mutation.py" <<'MAYA_PY'
          """Diagnostic observer only. Never edits source, test arguments, results or timeouts."""
          import collections
          import datetime
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import sys
          import tempfile
          import time


          def digest(data):
              return hashlib.sha256(data).hexdigest()


          def expected_states(backend):
              mutants = json.loads((backend / "test/widgets-live/mutations/gateFP.json").read_text())
              expected = {}
              for mutant in mutants:
                  edits = mutant.get("edits") or [mutant]
                  contents = {}
                  for edit in edits:
                      file = edit["file"]
                      text = contents.get(file, (backend / file).read_text())
                      assert text.count(edit["find"]) == 1
                      contents[file] = text.replace(edit["find"], edit["replace"])
                  expected[mutant["id"]] = {file: digest(text.encode()) for file, text in contents.items()}
              return expected


          def classify(mirror, expected):
              matches = []
              for name, files in expected.items():
                  try:
                      if all(digest((mirror / file).read_bytes()) == value for file, value in files.items()):
                          matches.append(name)
                  except FileNotFoundError:
                      pass
              return matches


          def safe_report(file):
              if not file.exists():
                  return None
              result = {"file": file.name, "bytes": file.stat().st_size, "modified": file.stat().st_mtime}
              try:
                  value = json.loads(file.read_text())
                  result.update({key: value.get(key) for key in [
                      "success", "numPassedTests", "numFailedTests", "numPendingTests",
                      "numPassedTestSuites", "numFailedTestSuites", "startTime",
                  ]})
                  result["reportSha256"] = digest(file.read_bytes())
              except (ValueError, FileNotFoundError):
                  result["completeJson"] = False
              return result


          def process_snapshot(root_pid):
              text = subprocess.check_output(
                  ["ps", "-eo", "pid=,ppid=,rss=,pcpu=,etime=,stat=,comm="], text=True
              )
              rows = []
              for line in text.splitlines():
                  fields = line.split(None, 6)
                  if len(fields) != 7:
                      continue
                  pid, ppid, rss, cpu, elapsed, state, command = fields
                  rows.append({"pid": int(pid), "ppid": int(ppid), "rssKiB": int(rss),
                               "cpu": cpu, "elapsed": elapsed, "state": state,
                               "command": pathlib.Path(command).name})
              descendants = {root_pid}
              for _ in range(20):
                  added = {row["pid"] for row in rows if row["ppid"] in descendants}
                  if added <= descendants:
                      break
                  descendants |= added
              selected = [row for row in rows if row["pid"] in descendants]
              for row in selected:
                  proc = pathlib.Path("/proc") / str(row["pid"])
                  try:
                      row["fdCount"] = len(list((proc / "fd").iterdir()))
                      args = (proc / "cmdline").read_bytes().split(b"\0")
                      # Only fixed tool labels; never emit arguments, environment or query text.
                      row["tool"] = next((label for label in ["jest", "tsc", "k3-gateway-check.mjs",
                                          "widgets-mutation-battery.mjs", "ts-node", "npm"]
                                          if any(label.encode() in arg for arg in args)), "other")
                  except (FileNotFoundError, PermissionError):
                      row["tool"] = "unavailable"
              return selected


          def main():
              assert sys.argv[1] == "--"
              command = sys.argv[2:]
              assert command == ["node", "scripts/widgets-mutation-battery.mjs", "--gate", "FP",
                                 "--out", "widgets-mutation-part-FP.json"]
              backend = pathlib.Path.cwd().resolve()
              head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
              assert head == "18fc4314d5b1a24370d426520315bdf63735bbec"
              assert not subprocess.check_output(["git", "status", "--porcelain"]).strip()
              key = hashlib.sha1(str(backend).encode()).hexdigest()[:10]
              temp = pathlib.Path(tempfile.gettempdir())
              mirror = temp / ("widgets-mutation-mirror-" + key) / "maya-saas-backend"
              reports = [temp / ("widgets-mutation-" + name + "-" + key + ".json") for name in ["unit", "live"]]
              expected = expected_states(backend)
              out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "maya-mutation-diagnostic"
              out.mkdir(exist_ok=True)
              child = subprocess.Popen(command)
              started = time.monotonic()
              with (out / "observations.jsonl").open("w") as stream:
                  while True:
                      try:
                          observation = {
                              "diagnosticOnly": True, "admissibleForCertification": False,
                              "candidate": head, "at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                              "elapsedSeconds": round(time.monotonic() - started, 1),
                              "mutantMatches": classify(mirror, expected),
                              "jestReports": [safe_report(file) for file in reports],
                              "processes": process_snapshot(child.pid),
                              "exit": child.poll(),
                          }
                      except Exception as error:
                          observation = {"diagnosticOnly": True, "observerError": type(error).__name__,
                                         "exit": child.poll()}
                      line = json.dumps(observation, separators=(",", ":"))
                      stream.write(line + "\n")
                      stream.flush()
                      print("MAYA_DIAGNOSTIC " + line, flush=True)
                      if child.poll() is not None:
                          break
                      time.sleep(30)
              final = {"diagnosticOnly": True, "admissibleForCertification": False, "candidate": head,
                       "exit": child.returncode, "sourceUnchanged": not subprocess.check_output(
                           ["git", "diff", "--name-only"]).strip()}
              receipt = backend / "widgets-mutation-part-FP.json"
              if receipt.exists():
                  (out / receipt.name).write_bytes(receipt.read_bytes())
              (out / "summary.json").write_text(json.dumps(final, indent=2) + "\n")
              sys.exit(child.returncode if child.returncode >= 0 else 1)


          if __name__ == "__main__":
              main()

          MAYA_PY
      - name: Run the battery shard
        env:
          SHARD: FP
          SLOT: FP
        run: >-
          python3 "$RUNNER_TEMP/maya-observe-mutation.py" -- node scripts/widgets-mutation-battery.mjs --gate
          "$SHARD" --out "widgets-mutation-part-$SLOT.json"
      - name: Preserve diagnostic observations; never a release receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-only-fp-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/maya-mutation-diagnostic/
          if-no-files-found: error
