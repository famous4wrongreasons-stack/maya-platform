<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iPhone 17 Pro Max — 360°</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0b0c0e;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  #stage{position:fixed;inset:0;
    background:radial-gradient(120% 90% at 50% 28%, #2a2d33 0%, #141519 42%, #08090b 100%)}
  #c{display:block;width:100%;height:100%}
  .hud{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    color:#aeb2ba;font-size:13px;letter-spacing:.04em;display:flex;gap:18px;align-items:center;
    background:rgba(20,22,26,.5);backdrop-filter:blur(8px);padding:9px 16px;border-radius:30px;border:1px solid rgba(255,255,255,.07)}
  .hud b{color:#fff;font-weight:600}
  .hud button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#e7e8ea;
    padding:6px 12px;border-radius:20px;font-size:12px;cursor:pointer}
  .hud button:hover{background:rgba(255,255,255,.16)}
  #title{position:fixed;left:50%;top:22px;transform:translateX(-50%);color:#e9eaec;text-align:center}
  #title .t{font-size:15px;font-weight:600;letter-spacing:.02em}
  #title .s{font-size:12px;color:#8d909a;margin-top:2px}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#9a9ea6;font-size:14px;letter-spacing:.1em}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="title"><div class="t">iPhone 17 Pro Max · Silver</div><div class="s">Мужская Эстетика — клиентское приложение</div></div>
<div id="loading">Загрузка 3D…</div>
<div class="hud">
  <span>Тяни мышкой · крутится сам</span>
  <button id="spinBtn">Пауза</button>
  <button id="frontBtn">Перёд</button>
  <button id="backBtn">Зад</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(20, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 17);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.enablePan = false;
controls.minDistance = 11;
controls.maxDistance = 26;
controls.minPolarAngle = Math.PI*0.16;
controls.maxPolarAngle = Math.PI*0.84;
controls.autoRotate = false;
let spinning = true;

// ---- lights (on top of the env reflections) ----
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(6, 9, 8); scene.add(key);
const rim = new THREE.DirectionalLight(0xbcd2ff, 1.6); rim.position.set(-8, 3, -6); scene.add(rim);
const fill = new THREE.DirectionalLight(0xffffff, 0.7); fill.position.set(0, -6, 6); scene.add(fill);
scene.add(new THREE.HemisphereLight(0xffffff, 0x20242b, 0.35));

// ================= dimensions (mm-proportional) =================
const BW = 2.34, BH = 4.90, BD = 0.263, BR = 0.30;        // body 78 x 163.4 x 8.75
const phone = new THREE.Group(); scene.add(phone);

// materials
const alu = new THREE.MeshStandardMaterial({ color:0xd6d9de, metalness:1.0, roughness:0.34 });
const aluDark = new THREE.MeshStandardMaterial({ color:0xc4c7cd, metalness:1.0, roughness:0.42 });
const ceramic = new THREE.MeshPhysicalMaterial({ color:0xccd0d6, metalness:0.0, roughness:0.28, clearcoat:0.7, clearcoatRoughness:0.2 });
const glassBlack = new THREE.MeshPhysicalMaterial({ color:0x05060a, metalness:0.2, roughness:0.05, clearcoat:1.0, clearcoatRoughness:0.04 });
const lensGlass = new THREE.MeshPhysicalMaterial({ color:0x0a1320, metalness:0.6, roughness:0.06, clearcoat:1.0, emissive:0x10203a, emissiveIntensity:0.25, side:THREE.DoubleSide });
const ringMat = new THREE.MeshStandardMaterial({ color:0x2a2d33, metalness:1.0, roughness:0.22 });
const graphite = new THREE.MeshStandardMaterial({ color:0x33363b, metalness:1.0, roughness:0.42 });

// ---- body ----
const body = new THREE.Mesh(new RoundedBoxGeometry(BW, BH, BD, 10, BR), alu);
phone.add(body);

// ---- two-tone ceramic shield panel on the back (MagSafe zone) ----
const csW = 1.46, csH = 1.92, csR = 0.40;
const csShape = roundedRectShape(csW, csH, csR);
const csGeo = new THREE.ExtrudeGeometry(csShape, { depth:0.012, bevelEnabled:false });
csGeo.translate(0,0,0);
const cs = new THREE.Mesh(csGeo, ceramic);
cs.rotation.y = Math.PI;                 // face -Z (back)
cs.position.set(0, -0.36, -BD/2 - 0.010);
phone.add(cs);

// apple logo on the ceramic panel
makeAppleLogo().then(tex=>{
  const logo = new THREE.Mesh(new THREE.PlaneGeometry(0.48, 0.59),
    new THREE.MeshStandardMaterial({ map:tex, transparent:true, metalness:0.6, roughness:0.28, color:0xf2f4f6 }));
  logo.rotation.y = Math.PI;
  logo.position.set(0, -0.32, -BD/2 - 0.03);
  phone.add(logo);
});

// ================= front screen =================
const SBW = BW - 0.20, SBH = BH - 0.20, SR = 0.235;
makeScreenTexture('screen.png').then(tex=>{
  document.getElementById('loading').style.display='none';
  const shape = roundedRectShape(SBW, SBH, SR);
  const geo = new THREE.ShapeGeometry(shape);
  // UV map shape bounds -> 0..1
  fitUV(geo, SBW, SBH);
  const scr = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map:tex, toneMapped:false }));
  scr.position.set(0,0, BD/2 + 0.004);
  phone.add(scr);
});
// dynamic island
const island = new THREE.Mesh(new RoundedBoxGeometry(0.46,0.135,0.04,6,0.067), glassBlack);
island.position.set(0, SBH/2 - 0.165, BD/2 + 0.02);
phone.add(island);
// front glass sheen plane (very subtle)
const sheen = new THREE.Mesh(new THREE.PlaneGeometry(SBW, SBH),
  new THREE.MeshPhysicalMaterial({ transparent:true, opacity:0.05, roughness:0.03, metalness:0, clearcoat:1, color:0xffffff }));
sheen.position.set(0,0, BD/2 + 0.006);
phone.add(sheen);

// ================= rear camera plateau =================
const PW = 2.14, PH = 1.42, PThk = 0.17, PR = 0.30;
const plateau = new THREE.Mesh(new RoundedBoxGeometry(PW, PH, PThk, 8, PR), alu);
const pcx = 0, pcy = BH/2 - PH/2 - 0.14;          // plateau center (top of back)
plateau.position.set(pcx, pcy, -BD/2 - PThk/2);   // protrudes out the back
phone.add(plateau);
const gz = -BD/2 - PThk;                            // outer (back) face of plateau

// three lenses in a triangle, on the LEFT of the back (as you look at the rear)
const lensDefs = [
  [ 0.60,  0.34],
  [ 0.60, -0.34],
  [ 0.04,  0.00]
];
lensDefs.forEach(([lx,ly])=> addLens(pcx+lx, pcy+ly, gz));

// flash + LiDAR + mic on the RIGHT of the back
addSmall(pcx-0.66, pcy+0.30, gz, 0x101316, 0.085);        // mic
addSmall(pcx-0.66, pcy+0.02, gz, 0xfff3d4, 0.105, 0.7);   // True Tone flash
addSmall(pcx-0.66, pcy-0.30, gz, 0x0a0d11, 0.085);        // LiDAR

function addLens(x, y, zface){
  const g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.30,0.315,0.09,48), graphite);
  base.rotation.x = Math.PI/2; base.position.z = -0.03; g.add(base);     // protrudes outward (-z)
  const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.245,0.265,0.15,48), ringMat);
  ring.rotation.x = Math.PI/2; ring.position.z = -0.06; g.add(ring);
  const glass = new THREE.Mesh(new THREE.CircleGeometry(0.215,48), lensGlass);
  glass.rotation.y = Math.PI; glass.position.z = -0.135; g.add(glass);   // faces outward
  const hi = new THREE.Mesh(new THREE.CircleGeometry(0.055,24),
    new THREE.MeshBasicMaterial({ color:0x9ab8ff, transparent:true, opacity:0.5, toneMapped:false, side:THREE.DoubleSide }));
  hi.rotation.y = Math.PI; hi.position.set(0.07,0.07,-0.138); g.add(hi);
  g.position.set(x, y, zface);
  phone.add(g);
}
function addSmall(x,y,zface,color,r,emi){
  const ring = new THREE.Mesh(new THREE.CylinderGeometry(r+0.022,r+0.032,0.08,32), graphite);
  ring.rotation.x = Math.PI/2; ring.position.set(x,y,zface-0.02); phone.add(ring);
  const mat = emi ? new THREE.MeshStandardMaterial({color, emissive:color, emissiveIntensity:emi, roughness:0.3, side:THREE.DoubleSide})
                  : new THREE.MeshPhysicalMaterial({color, roughness:0.08, metalness:0.3, clearcoat:1, side:THREE.DoubleSide});
  const dot = new THREE.Mesh(new THREE.CircleGeometry(r,32), mat);
  dot.rotation.y = Math.PI; dot.position.set(x,y,zface-0.06); phone.add(dot);
}

// ================= helpers =================
function roundedRectShape(w,h,r){
  const s = new THREE.Shape();
  const x=-w/2, y=-h/2;
  s.moveTo(x+r, y);
  s.lineTo(x+w-r, y); s.quadraticCurveTo(x+w, y, x+w, y+r);
  s.lineTo(x+w, y+h-r); s.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  s.lineTo(x+r, y+h); s.quadraticCurveTo(x, y+h, x, y+h-r);
  s.lineTo(x, y+r); s.quadraticCurveTo(x, y, x+r, y);
  return s;
}
function fitUV(geo, w, h){
  geo.computeBoundingBox();
  const uv = geo.attributes.uv, pos = geo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const px = pos.getX(i), py = pos.getY(i);
    uv.setXY(i, (px + w/2)/w, (py + h/2)/h);
  }
  uv.needsUpdate = true;
}
function makeScreenTexture(url){
  return new Promise((res)=>{
    const img = new Image(); img.crossOrigin='anonymous';
    img.onload = ()=>{
      const W=img.naturalWidth, H=img.naturalHeight;
      const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
      const ctx=cv.getContext('2d');
      const r=W*0.085;
      ctx.beginPath();
      ctx.moveTo(r,0); ctx.lineTo(W-r,0); ctx.arcTo(W,0,W,r,r);
      ctx.lineTo(W,H-r); ctx.arcTo(W,H,W-r,H,r);
      ctx.lineTo(r,H); ctx.arcTo(0,H,0,H-r,r);
      ctx.lineTo(0,r); ctx.arcTo(0,0,r,0,r); ctx.closePath(); ctx.clip();
      ctx.drawImage(img,0,0,W,H);
      const t=new THREE.CanvasTexture(cv);
      t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8;
      res(t);
    };
    img.onerror=()=>res(null);
    img.src=url;
  });
}
function makeAppleLogo(){
  return new Promise((res)=>{
    const cv=document.createElement('canvas'); cv.width=407; cv.height=500;
    const ctx=cv.getContext('2d'); ctx.scale(0.5,0.5);
    const p=new Path2D("M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76.5 0-103.7 40.8-165.9 40.8s-105.6-57-155.5-127C46.7 790.7 0 663 0 541.8c0-194.4 126.4-297.5 250.8-297.5 66.1 0 121.2 43.4 162.7 43.4 39.5 0 101.1-46 176.3-46 28.5 0 130.9 2.6 198.3 99.2zm-234-181.5c31.1-36.9 53.1-88.1 53.1-139.3 0-7.1-.6-14.3-1.9-20.1-50.6 1.9-110.8 33.7-147.1 75.8-28.5 32.4-55.1 83.6-55.1 135.5 0 7.8 1.3 15.6 1.9 18.1 3.2.6 8.4 1.3 13.6 1.3 45.4 0 102.5-30.4 135.5-71.3z");
    ctx.fillStyle='#ffffff'; ctx.fill(p);
    const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace;
    res(t);
  });
}

// ================= interaction =================
document.getElementById('spinBtn').onclick = (e)=>{
  spinning = !spinning;
  e.target.textContent = spinning ? 'Пауза' : 'Вращать';
};
let tween=null;
function faceTo(yTarget){
  spinning=false; document.getElementById('spinBtn').textContent='Вращать';
  let from = phone.rotation.y % (Math.PI*2); if(from<0) from+=Math.PI*2;
  phone.rotation.y = from;
  tween={from:from, to:yTarget, t:0};
}
document.getElementById('frontBtn').onclick = ()=>faceTo(0);
document.getElementById('backBtn').onclick = ()=>faceTo(Math.PI);

addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

(function loop(){
  requestAnimationFrame(loop);
  if(tween){
    tween.t=Math.min(1,tween.t+0.04);
    const e=1-Math.pow(1-tween.t,3);
    phone.rotation.y=tween.from+(tween.to-tween.from)*e;
    if(tween.t>=1) tween=null;
  }
  if(spinning && !tween) phone.rotation.y += 0.0075;
  controls.update();
  renderer.render(scene,camera);
})();
window.__scene={scene,phone,camera,renderer};
</script>
</body>
</html>
