<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тарифы — конструктор</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0c0e; --ink:#f4f1ea; --mut:#8d8a82; --line:rgba(255,255,255,.10);
  --panel:#141518; --panel2:#1b1d21; --accent:#e7ddc6; --accent-ink:#0b0c0e;
  --ok:#7ec98a;
}
[data-theme="light"]{
  --bg:#f4f3ef; --ink:#1b1b20; --mut:#6c6c74; --line:rgba(0,0,0,.12);
  --panel:#ffffff; --panel2:#f0efe9; --accent:#1b1b20; --accent-ink:#ffffff; --ok:#3b8f4d;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Manrope',-apple-system,sans-serif;line-height:1.5;
  padding:34px 20px 150px;transition:background .3s,color .3s}
.wrap{max-width:1040px;margin:0 auto}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:28px}
h1{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(26px,4vw,40px);letter-spacing:-.02em}
.sub{color:var(--mut);margin-top:8px;font-size:15px;max-width:560px}
#themeBtn{flex:none;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel);
  color:var(--ink);cursor:pointer;font-size:17px}
.plans{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:30px;max-width:760px;margin-left:auto;margin-right:auto}
@media(max-width:760px){.plans{grid-template-columns:1fr}}
.plan{position:relative;background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:20px 18px;cursor:pointer;
  transition:border-color .2s,transform .15s,box-shadow .2s}
.plan:hover{transform:translateY(-2px)}
.plan[aria-selected="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.plan .pt{font-family:'Syne',sans-serif;font-weight:700;font-size:20px}
.plan .pg{color:var(--mut);font-size:13px;margin-top:2px;min-height:34px}
.plan .pp{font-size:30px;font-weight:700;margin:10px 0 2px}
.plan .pp small{font-size:14px;color:var(--mut);font-weight:500}
.plan .pm{font-size:12px;color:var(--mut);margin-bottom:12px}
.plan ul{list-style:none;display:flex;flex-direction:column;gap:7px}
.plan li{font-size:13px;display:flex;gap:8px;align-items:flex-start}
.plan li .c{color:var(--ok);flex:none;font-weight:700}
.badge{position:absolute;top:-10px;right:14px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;
  padding:3px 9px;border-radius:20px;letter-spacing:.03em}
.radio{position:absolute;top:16px;right:16px;width:20px;height:20px;border-radius:50%;border:2px solid var(--line)}
.plan[aria-selected="true"] .radio{border-color:var(--accent);background:radial-gradient(circle at center,var(--accent) 0 5px,transparent 6px)}
h2{font-family:'Syne',sans-serif;font-weight:700;font-size:18px;margin:6px 0 12px}
.addons{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,420px));justify-content:center;gap:14px}
@media(max-width:760px){.addons{grid-template-columns:1fr}}
.addon{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;
  display:flex;flex-direction:column;gap:5px;transition:border-color .2s}
.addon[aria-pressed="true"]{border-color:var(--accent)}
.addon.incl{opacity:.7;cursor:default}
.addon .at{font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.addon .ag{font-size:12.5px;color:var(--mut)}
.addon .ap{font-size:13px;color:var(--ink);font-weight:600;margin-top:4px}
.sw{flex:none;width:40px;height:23px;border-radius:20px;background:var(--line);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:var(--ink);transition:left .2s}
.addon[aria-pressed="true"] .sw{background:var(--accent)}
.addon[aria-pressed="true"] .sw::after{left:19px;background:var(--accent-ink)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);
  padding:14px 20px;backdrop-filter:blur(10px)}
.barIn{max-width:1040px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.barIn .lbl{font-size:13px;color:var(--mut)}
.barIn .sum{font-size:13px}
.barIn .sum b{font-weight:600}
.total{font-family:'Syne',sans-serif;font-weight:800;font-size:26px}
.total small{font-size:14px;color:var(--mut);font-weight:500}
.cta{background:var(--accent);color:var(--accent-ink);border:none;border-radius:12px;padding:13px 26px;font-size:15px;
  font-weight:700;cursor:pointer;font-family:'Manrope'}
.note{color:var(--mut);font-size:12px;margin-top:26px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <a href="saas-site.html" style="font-family:'Syne',sans-serif;font-weight:800;font-size:16px;color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:7px;margin-bottom:12px"><span style="width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block"></span>MAYA</a>
      <h1>Собери свой тариф</h1>
      <p class="sub">Выбери основу под размер салона и подключи нужные модули. Платишь только за то, что используешь.</p>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex:none">
      <a href="onboarding.html" style="background:var(--accent);color:var(--accent-ink);border-radius:11px;padding:9px 15px;font-weight:600;font-size:13px;text-decoration:none">Подключить салон</a>
      <button id="themeBtn" title="Тема">☾</button>
    </div>
  </div>

  <div class="plans" id="plans"></div>

  <h2>Дополнительные модули</h2>
  <div class="addons" id="addons"></div>

  <p class="note">Демо-конструктор. Цены — предварительные, настраиваются в <code>plan_catalog.py</code>. Гейтинг фич — <code>tenant_features.has_feature()</code>.</p>
</div>

<div class="bar">
  <div class="barIn">
    <div>
      <div class="lbl" id="sumLine">—</div>
      <div class="total" id="total">—<small> ₽/мес</small></div>
    </div>
    <button class="cta" id="cta">Подключить салон →</button>
  </div>
</div>

<script>
const CATALOG = {"features": {"booking": "Онлайн-запись (YClients)", "branding": "Брендированный интерфейс: лого, цвета, тексты", "client_app": "Клиентское приложение: услуги, команда, инфо о салоне", "loyalty": "Баллы и лояльность", "shop": "Магазин: сертификаты и абонементы", "tg_basic": "Telegram-уведомления о записи", "tg_marketing": "Telegram-маркетинг: напоминания, реактивация, ДР, отзывы, рассылки", "journal": "Журнал записи: расписание дня, перенос, статусы", "staff_cabinet": "Кабинет сотрудника: режим мастера, история визитов, чаевые", "analytics": "Аналитика: дневной отчёт, выручка, зарплаты", "ai_chatbot": "Умный чат-бот: AI-администратор отвечает и записывает клиентов", "priority_support": "Приоритетная поддержка"}, "plans": [{"key": "start", "title": "Запись", "tagline": "Старт для небольшого салона", "price_rub": 990, "max_masters": 5, "features": ["booking", "branding", "client_app", "loyalty", "tg_basic"]}, {"key": "pro", "title": "Салон", "tagline": "Всё для работы салона", "price_rub": 2490, "max_masters": null, "features": ["booking", "branding", "client_app", "loyalty", "shop", "tg_basic", "tg_marketing", "journal", "staff_cabinet", "analytics", "priority_support"]}], "addons": [{"key": "ai_chatbot", "metered": {"unit": "dialog", "quota": 150, "overage_rub": 15, "model": "sonnet", "billing": "auto"}, "title": "Умный чат-бот", "tagline": "AI-администратор: отвечает клиентам, записывает, делает апсейл", "price_rub": 1990, "features": ["ai_chatbot"]}]};

const F = CATALOG.features;
const METERED={ai_chatbot:{quota:150,overage_rub:15,unit:'dialog'}};
const unitRu=u=>u==='dialog'?'диалогов':(u==='consultation'?'консультаций':u);
const DISABLED=['cutmatch','video_analytics']; // временно скрыты (см. plan_catalog.DISABLED); вернуть = []
let plan = "pro";                 // выбранный тариф
const addons = new Set();         // включённые допы (по ключу)
const fmt = n => n.toLocaleString("ru-RU");
const planOf = k => CATALOG.plans.find(p => p.key === k);
const planFeat = k => new Set(planOf(k).features);
const redundant = (pk, ad) => ad.features.every(f => planFeat(pk).has(f));

function total(){
  let s = planOf(plan).price_rub;
  for(const a of CATALOG.addons) if(addons.has(a.key) && !redundant(plan, a)) s += a.price_rub;
  return s;
}

function renderPlans(){
  document.getElementById("plans").innerHTML = CATALOG.plans.map(p => `
    <div class="plan" role="button" aria-selected="${p.key===plan}" data-k="${p.key}">
      ${p.key==='pro'?'<span class="badge">Хит</span>':''}
      <span class="radio"></span>
      <div class="pt">${p.title}</div>
      <div class="pg">${p.tagline}</div>
      <div class="pp">${fmt(p.price_rub)} <small>₽/мес</small></div>
      <div class="pm">${p.max_masters?('до '+p.max_masters+' мастеров'):'без лимита мастеров'}</div>
      <ul>${p.features.filter(f=>!DISABLED.includes(f)).map(f=>`<li><span class="c">✓</span><span>${F[f]}</span></li>`).join('')}</ul>
    </div>`).join('');
  document.querySelectorAll(".plan").forEach(el=>el.onclick=()=>{plan=el.dataset.k;render();});
}

function renderAddons(){
  document.getElementById("addons").innerHTML = CATALOG.addons.filter(a=>!DISABLED.includes(a.key)).map(a=>{
    const incl = redundant(plan, a);
    const on = incl || addons.has(a.key);
    return `<div class="addon ${incl?'incl':''}" role="button" aria-pressed="${on}" data-k="${a.key}" ${incl?'data-incl="1"':''}>
      <div class="at"><span>${a.title}</span><span class="sw"></span></div>
      <div class="ag">${a.tagline}</div>
      <div class="ap">${incl?'Входит в тариф':'+ '+fmt(a.price_rub)+' ₽/мес'}</div>${(!incl&&METERED[a.key])?'<div class="ag" style="margin-top:5px;opacity:.8">'+METERED[a.key].quota+' '+unitRu(METERED[a.key].unit)+' включено, далее '+METERED[a.key].overage_rub+' ₽</div>':''}
    </div>`;
  }).join('');
  document.querySelectorAll(".addon").forEach(el=>el.onclick=()=>{
    if(el.dataset.incl) return;
    const k=el.dataset.k; addons.has(k)?addons.delete(k):addons.add(k); render();
  });
}

function renderBar(){
  const act = CATALOG.addons.filter(a=>addons.has(a.key) && !redundant(plan,a)).map(a=>a.title);
  document.getElementById("sumLine").textContent =
    "Тариф «"+planOf(plan).title+"»" + (act.length?(" + "+act.join(" + ")):" — без допов") + " · ≈ "+fmt(Math.round(total()/30))+" ₽/день";
  document.getElementById("total").innerHTML = fmt(total())+'<small> ₽/мес</small>';
}

function render(){ renderPlans(); renderAddons(); renderBar(); }

document.getElementById("themeBtn").onclick = function(){
  const light = document.documentElement.getAttribute("data-theme")==="light";
  document.documentElement.setAttribute("data-theme", light?"dark":"light");
  this.textContent = light ? "☾" : "☀";
};
document.getElementById("cta").onclick = ()=>{
  location.href='onboarding.html?plan='+plan+(addons.size?'&addons='+[...addons].join(','):'');
};
render();
</script>
</body>
</html>
