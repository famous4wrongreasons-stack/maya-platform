name: maya-os-staging

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    networks:
      - private

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${STAGING_ENV_FILE:-.env.staging}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - staging_uploads:/app/uploads
    networks:
      - private

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      STAGING_HOST: ${STAGING_HOST:?STAGING_HOST is required}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/staging/Caddyfile:/etc/caddy/Caddyfile:ro
      - "../сайт и приложение:/srv/maya:ro"
      - "../сайт и приложение/pwa-assets/for-app:/srv/pwa-icons:ro"
      - staging_caddy_data:/data
      - staging_caddy_config:/config
    networks:
      - private

networks:
  private:
    driver: bridge

volumes:
  staging_postgres_data:
  staging_uploads:
  staging_caddy_data:
  staging_caddy_config:
