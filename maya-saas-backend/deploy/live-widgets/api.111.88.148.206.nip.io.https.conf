server {
    listen 80;
    listen [::]:80;
    server_name api.111.88.148.206.nip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/maya-saas-acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.111.88.148.206.nip.io;

    access_log /var/log/nginx/maya-saas-access.log sanitized;

    ssl_certificate /etc/letsencrypt/live/api.111.88.148.206.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.111.88.148.206.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3107;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
