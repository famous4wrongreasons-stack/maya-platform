<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Nothing is fetched and nothing is posted: the whole page is the script below. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<!-- The page is reached with ?code= in its own URL. No request may carry that onward as a Referer,
     which is why this page has no stylesheet, no font, no icon and no image: the previous version
     linked /app/fonts.css and leaked the authorization code to that request every single time. -->
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>MAYA</title>
<style>
  :root { color-scheme: light dark; --bg: #f4f0eb; --text: #18160f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000000; --text: #f4f0eb; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  body { display: flex; align-items: center; justify-content: center; padding: 1.5rem;
         font: 400 1.0625rem/1.5625rem -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif; }
  p { margin: 0; max-width: 24rem; text-align: center; }
</style>
</head>
<body>
<p id="m">Возвращаемся в MAYA…</p>
<noscript><p>Для входа нужен включённый JavaScript. Откройте MAYA и начните вход заново.</p></noscript>
<script>
/* Web Telegram returns in the exact window reserved by the initiating React carrier.
 * Move query credentials to an in-memory fragment without replacing this document. The initiating
 * app reads only this same-origin callback on its held window, erases the fragment and closes it.
 * No opener, postMessage, storage, token exchange or session installation lives here.
 * A standalone/reloaded callback cannot sign anyone in: the initiating runtime must still hold
 * the exact pending state. Nothing is forwarded to the app root or to another origin.
 */
(function () {
  'use strict';
  var out = document.getElementById('m');
  var say = function (text) { out.textContent = text; };
  try {
    var q = new URLSearchParams(location.search);
    // Erase the query even for a malformed/standalone callback.
    history.replaceState(null, '', location.pathname);
    window.opener = null;
    var state = q.get('state') || '';
    var code = q.get('code') || '';
    var error = q.get('error') || '';
    /* The server's own shape for a state it minted (social-auth.service.ts). Anything else was not
       issued here, and forwarding it would only make the shell refuse it one step later. */
    if (q.getAll('state').length !== 1 || q.getAll('code').length > 1 || q.getAll('error').length > 1 ||
        !/^te_[A-Za-z0-9_-]{8,128}$/.test(state) || (code === '') === (error === '')) {
      say('Ссылка входа не распознана — откройте MAYA и начните вход заново.');
      return;
    }
    var parts = ['oauth=telegram', 'state=' + encodeURIComponent(state)];
    parts.push(code !== '' ? 'code=' + encodeURIComponent(code) : 'error=' + encodeURIComponent(error));
    var fragment = '#' + parts.join('&');
    if (fragment.length > 4096) { say('Ссылка входа не распознана — начните вход в MAYA заново.'); return; }
    history.replaceState(null, '', location.pathname + fragment);
    say('Завершаем вход. Если окно осталось открытым, вернитесь в MAYA.');
  } catch (e) {
    say('Не удалось вернуться в MAYA — откройте приложение и начните вход заново.');
  }
})();
</script>
</body>
</html>
