server {
    listen 80;
    listen [::]:80;
    server_name maya.111.88.148.206.nip.io;

    root /var/www/maya-platform;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name maya.111.88.148.206.nip.io;

    root /var/www/maya-platform;
    index app.html;

    access_log /var/log/nginx/maya-platform-access.log sanitized;

    ssl_certificate /etc/letsencrypt/live/maya.111.88.148.206.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maya.111.88.148.206.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    client_max_body_size 10m;

    location = / {
        return 302 /app.html;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3107;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location ~* \.(?:woff2|png|jpg|jpeg|webp|svg|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location = /service-worker.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    location = /oauth-callback.html {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /app.html;
        add_header Cache-Control "no-cache";
    }
}
