<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, follow">
<title>404 — страница не найдена · Мужская Эстетика</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#000;color:#f4f0eb;font-family:'Montserrat',sans-serif;font-weight:300;
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        min-height:100vh;text-align:center;padding:32px;letter-spacing:0.02em}
  .code{font-size:clamp(64px,18vw,140px);font-weight:200;line-height:1;letter-spacing:0.05em}
  .ttl{font-size:clamp(13px,3.4vw,16px);letter-spacing:0.32em;text-transform:uppercase;
       margin:18px 0 8px;opacity:0.9}
  .sub{font-size:13px;line-height:1.6;opacity:0.55;max-width:340px;margin-bottom:34px}
  a.home{display:inline-flex;align-items:center;justify-content:center;
         padding:15px 32px;border:1px solid rgba(244,240,235,0.4);border-radius:50px;
         color:#f4f0eb;text-decoration:none;font-size:10px;letter-spacing:0.3em;
         text-transform:uppercase;font-weight:300;transition:background .35s,color .35s}
  a.home:hover{background:#f4f0eb;color:#000}
  .brand{position:fixed;top:26px;left:0;right:0;text-align:center;font-size:10px;
         letter-spacing:0.4em;text-transform:uppercase;opacity:0.5}
</style>
</head>
<body>
  <div class="brand">Мужская Эстетика</div>
  <div class="code">404</div>
  <div class="ttl">Страница не найдена</div>
  <p class="sub">Кажется, такой страницы нет или она переехала. Вернитесь на главную — там запись, услуги и контакты.</p>
  <a class="home" href="/">На главную</a>
</body>
</html>
