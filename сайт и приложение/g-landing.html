<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">
<title>Подарочный сертификат · Мужская Эстетика</title>
<!-- Самостоятельный хостинг шрифтов (без Google Fonts) — ПД/IP не уходят за рубеж -->
<link rel="stylesheet" href="/fonts.css">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#000;color:#f4f0eb;
    font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-weight:300;min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:40px 30px calc(40px + env(safe-area-inset-bottom,0px));
    letter-spacing:0.02em;overflow:hidden;position:relative;
  }
  /* Мягкое тёплое свечение сверху — глубина, как в приложении */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(120% 80% at 50% 6%, rgba(122,110,92,0.18), rgba(0,0,0,0) 60%);
  }
  .wrap{position:relative;z-index:1;max-width:420px;width:100%;
        animation:rise 1.1s cubic-bezier(.22,.61,.36,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .brand{font-family:'Montserrat',sans-serif;font-size:10px;letter-spacing:0.42em;
         text-transform:uppercase;opacity:0.55;margin-bottom:40px}
  .mono{margin:0 auto 26px;display:block}
  .eyebrow{font-family:'Montserrat',sans-serif;font-size:10.5px;letter-spacing:0.34em;
           text-transform:uppercase;opacity:0.62;margin-bottom:20px}
  h1{font-family:'Montserrat',sans-serif;font-weight:200;
     font-size:clamp(30px,8.4vw,46px);line-height:1.12;letter-spacing:0.01em;margin-bottom:24px}
  .rule{width:42px;height:1px;background:rgba(244,240,235,0.32);margin:0 auto 24px}
  .sub{font-size:13.5px;line-height:1.7;opacity:0.6;max-width:330px;margin:0 auto 40px}
  a.cta{display:inline-flex;align-items:center;justify-content:center;padding:16px 38px;
        border:1px solid rgba(244,240,235,0.4);border-radius:50px;color:#f4f0eb;text-decoration:none;
        font-family:'Montserrat',sans-serif;font-size:10px;letter-spacing:0.3em;text-transform:uppercase;
        font-weight:300;transition:background .4s,color .4s}
  a.cta:hover{background:#f4f0eb;color:#000}
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">Мужская Эстетика</div>
    <svg class="mono" width="58" height="62" viewBox="0 0 58 62" fill="none" aria-hidden="true">
      <line x1="5" y1="6" x2="5" y2="56" stroke="#f4f0eb" stroke-width="1.1" opacity="0.85"/>
      <line x1="53" y1="6" x2="53" y2="56" stroke="#f4f0eb" stroke-width="1.1" opacity="0.85"/>
      <text x="29" y="43" text-anchor="middle" font-family="'Montserrat',sans-serif" font-weight="200" font-size="38" fill="#f4f0eb">M</text>
    </svg>
    <div class="eyebrow">Подарочный сертификат</div>
    <h1>Мы ждём вас</h1>
    <div class="rule"></div>
    <p class="sub">Покажите сертификат мастеру в салоне — остальное мы берём на себя.</p>
    <a class="cta" href="/">Записаться</a>
  </div>
</body>
</html>
