<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="theme-color" content="#080808" />
    <title>MAYA — технические работы</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
        background: #080808;
        color: #f7f7f7;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: max(28px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom));
        background:
          radial-gradient(circle at 50% 25%, rgba(255, 255, 255, 0.08), transparent 38%),
          #080808;
      }

      main {
        width: min(100%, 460px);
        text-align: center;
      }

      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 34px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        font-size: 30px;
        font-weight: 300;
        letter-spacing: -0.08em;
      }

      h1 {
        margin: 0;
        font-size: clamp(32px, 8vw, 46px);
        line-height: 1.08;
        letter-spacing: -0.035em;
        font-weight: 620;
      }

      p {
        margin: 20px auto 0;
        max-width: 360px;
        color: rgba(255, 255, 255, 0.64);
        font-size: 17px;
        line-height: 1.48;
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="maintenance-title">
      <div class="mark" aria-hidden="true">M</div>
      <h1 id="maintenance-title">Ведутся технические работы</h1>
      <p>Мы готовим новую версию MAYA. Приложение временно недоступно.</p>
    </main>
  </body>
</html>
